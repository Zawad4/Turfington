name: Enterprise E2E Selenium Test Automation Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-e2e-tests:
    name: Selenium WebDriver Cross-Browser E2E Execution
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome]

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install NPM Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 4. Start React Web Application Server & Backend API
        run: |
          node server.js > server.log 2>&1 &
          npm run dev > vite.log 2>&1 &
          
          # Health check polling loop
          for i in $(seq 1 20); do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "✅ Frontend server is healthy and listening on http://localhost:5173!"
              break
            fi
            echo "Waiting for services to spin up ($i/20)..."
            sleep 2
          done

      - name: 5. Run Selenium E2E Test Suite (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: true
        run: npm run test:e2e || true

      - name: 6. Generate ExcelJS and Mochawesome Reports
        if: always()
        run: npm run generate:reports || true

      - name: 7. Upload E2E Excel & HTML Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-E2E-Reports-${{ matrix.browser }}
          path: |
            reports/
            excel/*.xlsx
            screenshots/
            logs/
          retention-days: 30
          if-no-files-found: ignore
