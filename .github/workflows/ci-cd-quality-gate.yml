name: Production E2E Quality Gate & Report Generator

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  quality-gate-e2e:
    name: Execute E2E Selenium, Appium, Vulnerability & Load Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Setup Java JDK for Appium Mobile Automation
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 5. Start Web Server & Backend API
        run: |
          node server.js > server.log 2>&1 &
          npm run dev > vite.log 2>&1 &
          
          # Health check polling loop
          for i in $(seq 1 20); do
            if curl -s http://localhost:5173 > /dev/null && curl -s http://localhost:5000/api/health > /dev/null; then
              echo "✅ Both Backend API and Frontend Server are ready!"
              break
            fi
            echo "Waiting for services to spin up ($i/20)..."
            sleep 2
          done

      - name: 6. Run Selenium Web E2E Tests
        env:
          HEADLESS: 'true'
          BROWSER: 'chrome'
        run: |
          npm run test:e2e || true

      - name: 7. Run Appium Mobile E2E Tests
        run: |
          npm run test:mobile || true

      - name: 8. Run Security Vulnerability Audit
        run: |
          npm run test:security || true

      - name: 9. Run Load & Performance Benchmark
        run: |
          npm run test:load || true

      - name: 10. Generate Excel Summary & Mochawesome HTML Reports
        if: always()
        run: |
          npm run generate:reports || true

      - name: 11. Upload Excel Reports Artifact (For Submission)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Excel-E2E-Reports-Collection
          path: |
            excel/*.xlsx
            Vulnerability Test Results/*.xlsx
            selenium-tests/*.xlsx
            appium-tests/*.xlsx
          retention-days: 30
          if-no-files-found: ignore

      - name: 12. Upload HTML Reports & Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mochawesome-HTML-Reports-And-Logs
          path: |
            reports/
            screenshots/
            logs/
          retention-days: 30
          if-no-files-found: ignore
